[project]
name = "immich-winnow"
version = "0.1.0"
description = "AI photo culling for Immich — hide the rejects, crown the keepers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Coop" }]
requires-python = ">=3.11"
keywords = ["immich", "photos", "culling", "claude", "anthropic", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "anthropic>=0.66",
    "httpx>=0.27",
    "pillow>=10.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
winnow = "winnow.cli:app"

[project.urls]
Homepage = "https://github.com/robertcoop/immich-winnow"
Issues = "https://github.com/robertcoop/immich-winnow/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winnow"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.coverage.run]
source = ["src/winnow"]
